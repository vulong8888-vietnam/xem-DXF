<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Xem CAD</title>
<style>
:root{color-scheme:dark;--bg:#000000;--fg:#f2f2f2;--ui:#14181d;--mute:#8b949e;--line:#2a313a;--accent:#ffc857;--on:#111111;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000000;--fg:#f2f2f2;--ui:#14181d;--mute:#8b949e;--line:#2a313a;--accent:#ffc857;--on:#111111}}
:root[data-theme="dark"]{--bg:#000000;--fg:#f2f2f2;--ui:#14181d;--mute:#8b949e;--line:#2a313a;--accent:#ffc857;--on:#111111}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
#app{height:100%;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--ui);border-bottom:1px solid var(--line)}
header h1{font-size:16px;margin:0;font-weight:650;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
button,.btn{font:inherit;color:var(--fg);background:transparent;border:1px solid var(--line);border-radius:8px;padding:8px 12px;min-height:40px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
button:focus-visible,.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pri{background:var(--accent);color:var(--on);border-color:var(--accent);font-weight:600}
select{font:inherit;color:var(--fg);background:var(--ui);border:1px solid var(--line);border-radius:8px;padding:8px;min-height:40px}
.bar select{flex:1}
.bar.bar2{display:none;margin-top:6px}
.bar.bar2.show{display:flex}
footer{padding:6px 10px 8px;border-radius:18px 18px 0 0;box-shadow:0 -6px 20px rgba(0,0,0,.18)}
.bar{gap:2px}
.tb{flex-direction:column;gap:3px;border:0;border-radius:14px;padding:7px 4px 6px;min-height:54px;font-size:12px;line-height:1.1;color:var(--mute);min-width:0;white-space:nowrap}
.tb svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tb:active{background:var(--line)}
.tb.on,.tb.on:active{background:var(--accent);color:var(--on)}
.bar2{gap:6px}
.bar2 button,.bar2 select{min-height:34px;font-size:13px;border-radius:999px;padding:5px 12px}
#st{text-align:center;margin-top:4px}
.chip{min-height:34px;padding:4px 12px;border-radius:999px;font-size:13.5px}
#stage #sheet{max-height:72%;border-radius:18px 18px 0 0;box-shadow:0 -10px 30px rgba(0,0,0,.3)}
#sheet .top{gap:6px}
body footer{position:relative;padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px))}
footer > .bar:not(.bar2){display:none}
#panel{position:absolute;left:8px;right:8px;bottom:100%;margin-bottom:8px;display:flex;flex-direction:column;gap:5px;padding:6px;background:rgba(28,33,39,.96);border:1px solid var(--line);border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.55);z-index:4}
#panel:not(:has(.show)){display:none}
#panel .bar2{margin:0}
.bar2 .ck{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.bar2 .ck button,.bar2 .ck select{flex:1;min-width:0}
#panel .bar2 input[type=checkbox]{flex:none;width:20px;height:20px;min-height:0;padding:0;accent-color:var(--accent);border:0;background:none;border-radius:4px}
#lsbtn{display:flex;align-items:center;gap:8px;justify-content:space-between}
#lsbtn svg{flex:1;min-width:0;height:12px}
#lspop{position:absolute;left:6px;bottom:calc(100% + 8px);display:none;width:min(300px,calc(100vw - 28px));background:#2b3138;border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.6);padding:6px;z-index:7}
#lspop.open{display:block}
select option{background:#2b3138;color:#f2f2f2}
#lwbtn{display:flex;align-items:center;gap:8px;justify-content:space-between}
#lwbtn svg{flex:1;min-width:0;height:12px}
#lwpop{position:absolute;right:6px;bottom:calc(100% + 8px);display:none;width:min(240px,calc(100vw - 28px));background:#2b3138;border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.6);padding:6px;z-index:7}
#lwpop.open{display:block}
#lwpop .lsi{display:flex;width:100%;align-items:center;justify-content:space-between;gap:12px;border:0;border-radius:8px;padding:8px 10px;min-height:34px;background:transparent;color:var(--fg)}
#lwpop .lsi.on{background:rgba(255,200,87,.18)}
#lwpop .lsi svg{flex:1;height:12px}
#lwpop .lsi b{flex:none;width:18px;text-align:right;font-weight:600;color:var(--mute)}
#lspop .lsi{display:flex;width:100%;align-items:center;justify-content:space-between;gap:12px;border:0;border-radius:8px;padding:8px 10px;min-height:34px;background:transparent;color:var(--fg)}
#lspop .lsi.on{background:rgba(255,200,87,.18)}
#lspop .lsi svg{flex:1;height:12px}
#lspop .lsi b{flex:none;width:18px;text-align:right;font-weight:600;color:var(--mute)}
#lspop .lsc{display:flex;gap:6px;align-items:center;padding:8px 6px 4px;border-top:1px solid var(--line);margin-top:4px}
#lspop .lsc input{flex:1;min-width:0;font:inherit;font-size:13px;color:var(--fg);background:rgba(255,255,255,.08);border:0;border-radius:8px;padding:6px 10px;min-height:34px}
#lspop .lsc button{border:0;border-radius:8px;background:var(--accent);color:var(--on);padding:6px 14px;min-height:34px}
#stage #tdlg{position:absolute;left:0;right:0;bottom:0;max-height:88%;display:none;flex-direction:column;background:#2b3138;border-radius:20px 20px 0 0;box-shadow:0 -12px 40px rgba(0,0,0,.6);z-index:8}
#stage #tdlg.open{display:flex}
#tdlg .top{display:flex;align-items:center;padding:12px 16px 4px}
#tdlg .top b{flex:1;font-size:15px;font-weight:600;color:var(--fg)}
#tdlg .top button{border:0;width:36px;min-height:36px;padding:0;border-radius:50%;background:rgba(255,255,255,.08)}
#tdbody{overflow:auto;padding:0 16px 6px}
#tdlg .dr{display:grid;grid-template-columns:22px 104px 1fr;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.07)}
#tdlg .dr input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent)}
#tdlg .dr input:not([type=checkbox]),#tdlg .dr select{min-height:36px;padding:6px 12px;border-radius:10px;border:0;background:rgba(255,255,255,.08);color:var(--fg);font:inherit;min-width:0}
#tdlg .dr input[type=color]{padding:2px;width:60px}
#tdlg .dnote{padding:8px 0 0;color:var(--mute);font-size:12.5px}
#tdlg .dbtn{display:flex;gap:8px;padding:10px 16px calc(14px + env(safe-area-inset-bottom,0px))}
#tdlg .dbtn button{flex:1;min-height:42px;border-radius:999px;border:0;background:rgba(255,255,255,.09)}
#tdlg .dbtn .pri{background:var(--accent);color:var(--on);font-weight:650}
#panel.fold{display:none}
#pfold{flex:none;border:0;width:40px;min-height:40px;padding:0;border-radius:50%;background:rgba(255,255,255,.09)}
#pfold svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;transition:transform .15s}
#pfold.up svg{transform:rotate(180deg)}
#panel .bar2 button,#panel .bar2 select,#panel .bar2 input{background:rgba(255,255,255,.07);border-color:transparent}
#panel .bar2 button.on{background:var(--accent);color:var(--on)}
#panel .bar2 .pri{background:var(--accent);color:var(--on)}
#dock{display:flex;align-items:center;gap:10px;margin-top:6px}
#tbtn{flex:none;gap:8px;border:0;border-radius:999px;background:var(--accent);color:var(--on);font-weight:650;padding:8px 18px 8px 14px}
#tbtn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#tname{flex:1;min-width:0;color:var(--fg);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#toff{flex:none;border:0;width:40px;padding:0;border-radius:50%;background:rgba(255,255,255,.09)}
#psel{flex:none;width:44px;min-height:40px;padding:0;border:0;border-radius:50%;background:rgba(255,255,255,.09)}
#psel svg{width:22px;height:22px;fill:currentColor;stroke:none}
#psel.on{background:var(--accent);color:var(--on)}
#pok{flex:none;display:none;border:0;border-radius:999px;background:#4dd0e1;color:#06252b;font-weight:650;padding:8px 14px}
#stage #tools{position:absolute;left:0;right:0;bottom:0;max-height:80%;display:none;flex-direction:column;background:#2b3138;border-radius:20px 20px 0 0;box-shadow:0 -12px 40px rgba(0,0,0,.6);z-index:6}
#stage #tools.open{display:flex}
#tools .top{display:flex;align-items:center;padding:12px 16px 2px}
#tools .top b{flex:1;font-size:15px;color:var(--mute);font-weight:600}
#tools .top button{border:0;width:36px;min-height:36px;padding:0;border-radius:50%;background:rgba(255,255,255,.08)}
#tgrid{overflow:auto;padding:2px 14px 20px}
#tgrid h3{margin:16px 2px 6px;font-size:17px;font-weight:500;color:#aeb6bf}
#tgrid .g{display:grid;grid-template-columns:repeat(4,1fr);gap:6px 4px}
.tile{display:flex;flex-direction:column;gap:6px;border:0;border-radius:14px;padding:10px 2px 8px;min-height:92px;font-size:12.5px;line-height:1.25;text-align:center;color:var(--fg);background:transparent;white-space:normal;justify-content:flex-start}
.tile:active{background:rgba(255,255,255,.08)}
.tile.on{background:rgba(255,200,87,.16);outline:1.5px solid var(--accent)}
.tile svg{width:40px;height:40px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tile svg .a{stroke:#4dd0e1}
.tile svg .af{fill:#4dd0e1;stroke:none}
.tile svg .w{fill:currentColor;stroke:none}
.ib{width:40px;min-height:40px;padding:0;border-radius:10px;flex:none}
.ib svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.bar2 .tsw{flex:none;width:28px;height:28px;min-height:28px;padding:0;border-radius:50%;border:2px solid var(--line)}
.bar2 .tsw.on{border-color:var(--fg);box-shadow:inset 0 0 0 2px var(--bg)}
#rowt1 button{padding:6px 8px}
#ttxt{flex:3}
#tsize{flex:1;max-width:84px}
#rowt3{justify-content:center;align-items:center}
.bar2 .swc{flex:none;width:28px;height:28px;min-height:28px;padding:0;border-radius:50%;border:2px solid var(--line)}
.bar2 .swc.on{border-color:var(--fg)}
.bar2 input[type=color]{flex:none;width:46px;padding:2px;cursor:pointer}
.bar2 input{flex:1;min-width:0;font:inherit;font-size:13.5px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:5px 12px;min-height:34px}
.bar2 input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
#res{position:absolute;left:12px;right:12px;top:10px;display:none;pointer-events:none;background:var(--ui);border:1px solid var(--line);border-radius:14px;padding:10px 14px;box-shadow:0 6px 20px rgba(0,0,0,.2);text-align:center}
#res.show{display:block}
#res b{display:block;font-size:26px;line-height:1.15;color:var(--accent);font-variant-numeric:tabular-nums}
#res span{color:var(--mute);font-size:13px}
.lay{cursor:pointer;padding:11px 0}
.lay .sw{width:18px;height:18px;border-radius:5px}
.lay input[type=checkbox]{appearance:none;-webkit-appearance:none;order:3;flex:none;margin:0;width:44px;height:26px;border-radius:13px;background:var(--line);position:relative;transition:background .15s;cursor:pointer}
.lay input[type=checkbox]::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--bg);transition:transform .15s}
.lay input[type=checkbox]:checked{background:var(--accent)}
.lay input[type=checkbox]:checked::after{transform:translateX(18px);background:var(--on)}
.lay input[type=checkbox]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.on{background:var(--accent);color:var(--on);border-color:var(--accent)}
#stage{position:relative;flex:1;min-height:0}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center}
#empty h2{margin:0;font-size:22px}
#empty p{margin:0;color:var(--mute);max-width:32ch}
#empty .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
#msg{position:absolute;left:12px;right:12px;top:10px;background:var(--ui);border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:none}
footer{background:var(--ui);border-top:1px solid var(--line);padding:8px 12px}
.bar{display:flex;gap:8px}
.bar button{flex:1}
#st{margin-top:6px;color:var(--mute);font-size:12.5px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#sheet{position:absolute;left:0;right:0;bottom:0;max-height:60%;background:var(--ui);border-top:1px solid var(--line);display:none;flex-direction:column}
#sheet.open{display:flex}
#sheet .top{display:flex;gap:8px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line)}
#sheet .top b{flex:1}
#list{overflow:auto;padding:4px 12px 12px}
.lay{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.lay input{width:20px;height:20px;accent-color:var(--accent)}
.sw{width:14px;height:14px;border-radius:3px;border:1px solid var(--line)}
.lay span.n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lay small{color:var(--mute)}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1 id="title">Xem CAD</h1>
    <button id="dimb" class="ib" aria-label="Hiện kích thước cạnh"><svg viewBox="0 0 24 24"><path d="M4 7v10M20 7v10M4 12h16M4 12l3-2M4 12l3 2M20 12l-3-2M20 12l-3 2"/></svg></button>
    <button id="fit" class="ib" aria-label="Vừa khung"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    <button id="lay" class="ib" aria-label="Layer"><svg viewBox="0 0 24 24"><path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3 13l9 5 9-5"/></svg></button>
    <label class="btn pri" for="file">Mở file</label>
    <input id="file" type="file" accept=".dxf,.DXF,.dwg,.DWG" hidden>
  </header>
  <div id="stage">
    <canvas id="c"></canvas>
    <div id="empty">
      <h2>Mở bản vẽ CAD</h2>
      <p>Chọn file DXF từ điện thoại để xem, phóng to, thu nhỏ, bật tắt layer và đo khoảng cách.</p>
      <div class="row">
        <label class="btn pri" for="file">Chọn file DXF</label>
        <button id="demo">Xem bản vẽ mẫu</button>
      </div>
    </div>
    <div id="res" aria-live="polite"><b id="resv"></b><span id="resd"></span></div>
    <div id="msg" role="alert"></div>
    <div id="tdlg">
        <div class="top"><b>Thay đổi thuộc tính chữ</b><button id="tdclose" aria-label="Đóng">✕</button></div>
        <div id="tdbody">
          <label class="dr"><input type="checkbox" id="cfont"><span>Font</span><select id="dfont"></select></label>
          <label class="dr"><input type="checkbox" id="chh"><span>Chiều cao</span><input id="dh" type="number" inputmode="decimal" step="any" min="0" placeholder="vd 0,2"></label>
          <label class="dr"><input type="checkbox" id="chw"><span>Chiều rộng</span><input id="dw" type="number" inputmode="decimal" step="any" min="0" placeholder="vd 0,2"></label>
          <label class="dr"><input type="checkbox" id="csc"><span>Phóng cỡ (%)</span><input id="dsc" type="number" inputmode="decimal" step="any" min="1" placeholder="vd 125 (to hơn), 80 (nhỏ hơn)"></label>
          <label class="dr"><input type="checkbox" id="csp"><span>Giãn ký tự</span><input id="dsp" type="number" inputmode="decimal" step="any" placeholder="0"></label>
          <label class="dr"><input type="checkbox" id="csl"><span>Nghiêng (độ)</span><input id="dsl" type="number" inputmode="decimal" step="any" placeholder="0"></label>
          <label class="dr"><input type="checkbox" id="cul"><span>Gạch chân</span><select id="dul"><option value="1">Bật</option><option value="0">Tắt</option></select></label>
          <label class="dr"><input type="checkbox" id="cvt"><span>Chữ dọc</span><select id="dvt"><option value="1">Bật</option><option value="0">Tắt</option></select></label>
          <label class="dr"><input type="checkbox" id="cj"><span>Căn lề</span><select id="dj"></select></label>
          <label class="dr"><input type="checkbox" id="cb"><span>Chữ đậm</span><select id="db"><option value="1">Bật</option><option value="0">Tắt</option></select></label>
          <label class="dr"><input type="checkbox" id="ccol"><span>Màu chữ</span><input id="dcol" type="color" value="#ffffff"></label>
          <div class="dnote">Chỉ những mục được tích mới được áp dụng. Chạm vào từng dòng chữ trên bản vẽ để đổi, hoặc bấm Áp dụng tất cả.</div>
        </div>
        <div class="dbtn"><button id="dall">Áp dụng tất cả chữ</button><button id="dok" class="pri">Xong</button></div>
      </div>
      <div id="tools"><div class="top"><b>Công cụ</b><button id="tclose" aria-label="Đóng">✕</button></div><div id="tgrid"></div></div>
      <div id="sheet">
      <div class="top"><b id="lcount">Layer</b><button id="allOn" class="chip">Hiện hết</button><button id="allOff" class="chip">Ẩn hết</button><button id="close" class="chip" aria-label="Đóng">✕</button></div>
      <div id="list"></div>
    </div>
  </div>
  <footer>
    <div class="bar">
      
      
      <button id="mea" class="tb"><svg viewBox="0 0 24 24"><path d="M3 17L17 3l4 4L7 21z"/><path d="M8 12l2 2M11 9l2 2M14 6l2 2"/></svg><span>Đo</span></button>
      
      
      <button id="are" class="tb"><svg viewBox="0 0 24 24"><path d="M5 6l11-2 4 9-8 7-7-5z"/></svg><span>Diện tích</span></button>
      <button id="drw" class="tb"><svg viewBox="0 0 24 24"><path d="M5 19L19 5"/><circle cx="5" cy="19" r="1.8"/><circle cx="19" cy="5" r="1.8"/></svg><span>Vẽ</span></button>
      <button id="txt" class="tb"><svg viewBox="0 0 24 24"><path d="M5 7V4h14v3M12 4v16M9 20h6"/></svg><span>Chữ</span></button>
      <button id="edt" class="tb"><svg viewBox="0 0 24 24"><path d="M12 3v18M3 12h18M12 3l-2.5 2.5M12 3l2.5 2.5M12 21l-2.5-2.5M12 21l2.5-2.5M3 12l2.5-2.5M3 12l2.5 2.5M21 12l-2.5-2.5M21 12l-2.5 2.5"/></svg><span>Sửa</span></button>
    </div>
    <div id="panel">
    <div id="lspop"></div>
    <div id="lwpop"></div>
    <div class="bar bar2" id="rowp1">
      <button id="psE" class="on">Cạnh</button>
      <button id="psP">Cả đường</button>
      <button id="psT">Chữ</button>
      <button id="pundo">Hoàn tác</button>
    </div>
    <div class="bar bar2" id="rowp2">
      <label class="ck"><input type="checkbox" id="cls" checked aria-label="Áp dụng kiểu nét"><button id="lsbtn" type="button" aria-label="Chọn kiểu nét"></button></label>
      <label class="ck"><input type="checkbox" id="clw" checked aria-label="Áp dụng độ dày"><button id="lwbtn" type="button" aria-label="Chọn độ dày"></button></label>
    </div>
    <div class="bar bar2" id="rowp3">
      <button id="tdopen" class="pri">Thuộc tính chữ…</button>
    </div>
    <div class="bar bar2" id="rowd">
      <button id="dsE" class="on">Cạnh</button>
      <button id="dsP">Cả đường</button>
      <button id="dsT">Chữ</button>
      <button id="xundo">Hoàn tác</button>
    </div>
    <div class="bar bar2" id="row6">
      <button id="e1" class="on">Màu</button>
      <button id="e2">Copy</button>
      <button id="e3">Move</button>
      <button id="eundo">Hoàn tác</button>
    </div>
    <div class="bar bar2" id="row7">

function shoe(q){var a=0,n=q.length/2;for(var i=0;i<n;i++){var j=(i+1)%n;a+=q[2*i]*q[2*j+1]-q[2*j]*q[2*i+1]}return a/2}

function dEnd(a,tapW){
  var f=lf(),L=parseFloat($('dlen').value)/f,A=parseFloat($('dang').value),ang,len;
  if(!isNaN(A))ang=A*Math.PI/180;
  else if(tapW)ang=Math.atan2(tapW[1]-a[1],tapW[0]-a[0]);
  else return null;
  if(dOrtho&&isNaN(A))ang=Math.round(ang/(Math.PI/2))*(Math.PI/2);
  if(!isNaN(L)&&L>0)len=L;
  else if(tapW){len=dOrtho&&isNaN(A)?Math.abs((tapW[0]-a[0])*Math.cos(ang)+(tapW[1]-a[1])*Math.sin(ang)):Math.hypot(tapW[0]-a[0],tapW[1]-a[1])}
  else return null;
  if(!(len>0))return null;
  return [a[0]+len*Math.cos(ang),a[1]+len*Math.sin(ang)];
}

function getBk(layer,col,ov){

  D.buckets.push(nb);return nb;
}
function mkPoly(pts,bk,src){
  var x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;
  for(var i=0;i<pts.length;i+=2){if(pts[i]<x0)x0=pts[i];if(pts[i]>x1)x1=pts[i];if(pts[i+1]<y0)y0=pts[i+1];if(pts[i+1]>y1)y1=pts[i+1]}
  var p={pts:pts,x0:x0,y0:y0,x1:x1,y1:y1,closed:false,r:undefined,rad:undefined,vi:undefined,arc:false,bk:bk};
  if(src){p.closed=src.closed;p.r=src.r;p.rad=src.rad?{r:src.rad.r,cx:src.rad.cx,cy:src.rad.cy}:undefined;p.vi=src.vi;p.arc=src.arc;p.ls=src.ls;p.dash=src.dash;p.lw=src.lw}
  bk.polys.push(p);return p;
}
function tr(a,dx,dy){var o=new Array(a.length);for(var i=0;i<a.length;i+=2){o[i]=a[i]+dx;o[i+1]=a[i+1]+dy}return o}
function mv(p,dx,dy){
  for(var i=0;i<p.pts.length;i+=2){p.pts[i]+=dx;p.pts[i+1]+=dy}
  p.x0+=dx;p.x1+=dx;p.y0+=dy;p.y1+=dy;
  if(p.rad){p.rad.cx+=dx;p.rad.cy+=dy}
}
function pickAt(sx,sy){
  var s=V.s,w=cv.clientWidth,h=cv.clientHeight,ox=w/2-V.x*s,oy=h/2+V.y*s,best=null,bd=22;
  D.buckets.forEach(function(b){
    if(hidden.has(b.layer))return;
    b.polys.forEach(function(p){
      if(p.x1*s+ox<sx-bd||p.x0*s+ox>sx+bd||oy-p.y1*s>sy+bd||oy-p.y0*s<sy-bd)return;
      var q=p.pts,n=q.length/2,idx=[],i;
      if(p.arc)idx=[0,n-1];else if(p.vi)idx=p.vi;else for(i=0;i<n;i++)idx.push(i);
      for(var k=0;k+1<idx.length;k++){
        var i0=idx[k],i1=idx[k+1],md=Infinity;
        for(i=i0;i<i1;i++){var d=segDist(sx,sy,q[2*i]*s+ox,oy-q[2*i+1]*s,q[2*i+2]*s+ox,oy-q[2*i+3]*s);if(d<md)md=d}
        if(md<bd){bd=md;best={p:p.base||p,chain:q.slice(2*i0,2*i1+2)}}
      }
    });
  });
  return best;
}
function applyColor(hit){

    eu.push(function(){prev.forEach(function(x){x[0].col=x[1]})});
  }else{
    var pts=escope==='edge'?hit.chain:base.pts,bk=getBk(base.bk.layer,col,true),np=mkPoly(pts.slice(),bk);
    np.base=base;(base.ovs||(base.ovs=[])).push(np);

      var j=base.ovs.indexOf(np);if(j>=0)base.ovs.splice(j,1);

function doXformOrig(dx,dy){
  if(!esel.length){$('st').textContent='Chưa chọn đối tượng nào';return}
  var sl=esel.slice();
  if(etool==='move'){
    sl.forEach(function(p){mv(p,dx,dy);(p.ovs||[]).forEach(function(o){mv(o,dx,dy)})});
    eu.push(function(){sl.forEach(function(p){mv(p,-dx,-dy);(p.ovs||[]).forEach(function(o){mv(o,-dx,-dy)})})});
    ephase='sel';ebase=null;$('epick').textContent='Chọn 2 điểm';
  }else{
    var made=[];
    sl.forEach(function(p){
      var np=mkPoly(tr(p.pts,dx,dy),p.bk,p);
      if(np.rad){np.rad.cx+=dx;np.rad.cy+=dy}
      made.push(np);D.layers[p.bk.layer]=(D.layers[p.bk.layer]||0)+1;D.count++;
      (p.ovs||[]).forEach(function(o){var no=mkPoly(tr(o.pts,dx,dy),o.bk,o);no.base=np;(np.ovs||(np.ovs=[])).push(no);made.push(no)});
    });
    eu.push(function(){made.forEach(function(q){
      var k=q.bk.polys.indexOf(q);if(k>=0)q.bk.polys.splice(k,1);
      if(!q.base){D.layers[q.bk.layer]--;D.count--}
    });renderLayers()});
  }
  var f=lf();
  showRes((etool==='move'?'Đã di chuyển ':'Đã sao chép ')+sl.length+' đối tượng','ΔX '+fmt(dx*f)+UL()+'   ΔY '+fmt(dy*f)+UL());

}

  if(!esel.length){$('st').textContent='Chọn cạnh cần '+(etool==='copy'?'sao chép':'di chuyển')+' trước';return}
  var q=esel[0].pts;
  ebase=[q[0],q[1]];ecur=ebase.slice();ephase='dest';$('epick').textContent='Xong';
  $('st').textContent='Di chuyển đến vị trí cần đặt (cạnh hiện theo con trỏ), bấm để '+(etool==='copy'?'sao chép':'di chuyển')+' đến đó';
  draw();
};
function wallsOf(Wd,Hd,ox,oy,s,lw,bx0,by0,bx1,by1){
  var c=document.createElement('canvas');c.width=Wd;c.height=Hd;
  var g2=c.getContext('2d',{willReadFrequently:true});
  g2.lineWidth=lw;g2.lineJoin='round';g2.lineCap='round';g2.strokeStyle='#000';g2.beginPath();
  D.buckets.forEach(function(b){
    if(hidden.has(b.layer))return;
    b.polys.forEach(function(p){
      if(p.x1<bx0||p.x0>bx1||p.y1<by0||p.y0>by1)return;
      var q=p.pts;g2.moveTo(q[0]*s+ox,oy-q[1]*s);
      for(var k=2;k<q.length;k+=2)g2.lineTo(q[k]*s+ox,oy-q[k+1]*s);
    });
  });
  g2.stroke();
  var d=g2.getImageData(0,0,Wd,Hd).data,wall=new Uint8Array(Wd*Hd);
  for(var i=0,n=Wd*Hd;i<n;i++)wall[i]=d[4*i+3]>40?1:0;
  return wall;
}
function fillSpan(wall,Wd,Hd,sx,sy){
  var vis=new Uint8Array(Wd*Hd),st=[sx,sy],cnt=0,leak=false,x0=Wd,y0=Hd,x1=0,y1=0,sxs=0,sys=0;
  while(st.length){
    var y=st.pop(),x=st.pop(),row=y*Wd;
    if(wall[row+x]||vis[row+x])continue;
    var l=x,r=x;
    while(l>0&&!wall[row+l-1]&&!vis[row+l-1])l--;
    while(r<Wd-1&&!wall[row+r+1]&&!vis[row+r+1])r++;
    if(l===0||r===Wd-1||y===0||y===Hd-1){leak=true;break}
    for(var i=l;i<=r;i++)vis[row+i]=1;
    var n=r-l+1;cnt+=n;sxs+=(l+r+1)/2*n;sys+=(y+0.5)*n;
    if(l<x0)x0=l;if(r>x1)x1=r;if(y<y0)y0=y;if(y>y1)y1=y;
    for(var dy=-1;dy<=1;dy+=2){
      var ny=y+dy;if(ny<0||ny>=Hd)continue;
      var inSpan=false,nr=ny*Wd;
      for(var j=l;j<=r;j++){
        var ok=!wall[nr+j]&&!vis[nr+j];
        if(ok&&!inSpan){st.push(j,ny);inSpan=true}else if(!ok)inSpan=false;
      }
    }
  }
  return {vis:vis,cnt:cnt,leak:leak,x0:x0,y0:y0,x1:x1,y1:y1,sx:sxs,sy:sys};
}
function edgeCount(v,Wd,Hd){
  var e=0;
  for(var y=0;y<Hd;y++)for(var x=0;x<Wd;x++){
    if(!v[y*Wd+x])continue;
    if(x===0||!v[y*Wd+x-1])e++;
    if(x===Wd-1||!v[y*Wd+x+1])e++;
    if(y===0||!v[(y-1)*Wd+x])e++;
    if(y===Hd-1||!v[(y+1)*Wd+x])e++;
  }
  return e;
}
function floodTap(sx,sy){
  var w=cv.clientWidth,h=cv.clientHeight,s=V.s,ox=w/2-V.x*s,oy=h/2+V.y*s,wp=toWorld(sx,sy),i;
  for(i=0;i<fl.length;i++){
    var f=fl[i];
    if(wp[0]>=f.X0&&wp[0]<f.X0+f.W/f.s&&wp[1]<=f.Y1&&wp[1]>f.Y1-f.H/f.s){
      var qx=Math.floor((wp[0]-f.X0)*f.s),qy=Math.floor((f.Y1-wp[1])*f.s);
      if(f.mask[qy*f.W+qx]){fl.splice(i,1);report();draw();return}
    }
  }
  var W=Math.max(2,Math.round(w)),H=Math.max(2,Math.round(h));
  var wall=wallsOf(W,H,ox,oy,s,2,V.x-w/2/s-4/s,V.y-h/2/s-4/s,V.x+w/2/s+4/s,V.y+h/2/s+4/s);
  var spx=Math.max(0,Math.min(W-1,Math.round(sx))),spy=Math.max(0,Math.min(H-1,Math.round(sy)));
  if(wall[spy*W+spx]){$('st').textContent='Chạm vào bên trong vùng, không chạm đúng vào đường nét';return}
  var r=fillSpan(wall,W,H,spx,spy);
  if(r.leak||!r.cnt){$('st').textContent='Vùng chưa kín hoặc nằm ngoài màn hình. Hãy thu nhỏ để thấy trọn vùng, hoặc dùng Tự chấm';return}
  var mw=4/s,minX=(r.x0-ox)/s,maxX=(r.x1+1-ox)/s,maxY=(oy-r.y0)/s,minY=(oy-(r.y1+1))/s;
  var X0=minX-mw,Y1=maxY+mw,bw=maxX-minX+2*mw,bh=maxY-minY+2*mw;
  var s2=Math.max(s,Math.min(1800/bw,1800/bh)),W2=Math.ceil(bw*s2),H2=Math.ceil(bh*s2);
  var use=r,sc=s,Wf=W,Hf=H,X0f=-ox/s,Y1f=oy/s;
  if(s2>s*1.2){
    var wall2=wallsOf(W2,H2,-X0*s2,Y1*s2,s2,2,X0,Y1-bh,X0+bw,Y1);
    var p2x=Math.floor((wp[0]-X0)*s2),p2y=Math.floor((Y1-wp[1])*s2);
    if(p2x>=0&&p2y>=0&&p2x<W2&&p2y<H2&&!wall2[p2y*W2+p2x]){
      var r2=fillSpan(wall2,W2,H2,p2x,p2y);
      if(!r2.leak&&r2.cnt>r.cnt*(s2/s)*(s2/s)*0.5){use=r2;sc=s2;Wf=W2;Hf=H2;X0f=X0;Y1f=Y1}
    }
  }
  var eg=edgeCount(use.vis,Wf,Hf),area=(use.cnt+eg)/(sc*sc);
  var ch=css('--accent'),rr=parseInt(ch.slice(1,3),16),gg=parseInt(ch.slice(3,5),16),bb2=parseInt(ch.slice(5,7),16);
  var hl=document.createElement('canvas');hl.width=Wf;hl.height=Hf;
  var hc=hl.getContext('2d'),im=hc.createImageData(Wf,Hf),vv=use.vis;
  for(i=0;i<Wf*Hf;i++)if(vv[i]){im.data[4*i]=rr;im.data[4*i+1]=gg;im.data[4*i+2]=bb2;im.data[4*i+3]=255}
  hc.putImageData(im,0,0);
  fl.push({mask:vv,W:Wf,H:Hf,s:sc,X0:X0f,Y1:Y1f,area:area,cx:X0f+use.sx/use.cnt/sc,cy:Y1f-use.sy/use.cnt/sc,hl:hl});
  report();draw();
}
function areaTap(sx,sy){
  if(manual){man.push(snap(sx,sy));report();draw();return}
  if(flood){floodTap(sx,sy);return}
  var w=toWorld(sx,sy),best=null,ba=Infinity;
  D.buckets.forEach(function(b){
    if(hidden.has(b.layer))return;
    b.polys.forEach(function(p){
      if(!p.closed||w[0]<p.x0||w[0]>p.x1||w[1]<p.y0||w[1]>p.y1)return;
      var a=areaOf(p);if(a<ba&&inside(p.pts,w[0],w[1])){best=p;ba=a}
    });
  });
  if(!best){$('st').textContent='Ở đây không có vùng kín. Dùng Tự chấm để chấm các góc.';return}
  var i=sel.indexOf(best);if(i>=0)sel.splice(i,1);else sel.push(best);
  report();draw();
}
function setArea(v){
  areaMode=v;$('are').classList.toggle('on',v);if(v&&editMode)setEdit(false);if(v&&textMode)setText(false);if(v&&drawMode){drawMode=false;ds=null;$('drw').classList.remove('on')}updRow();if(!v)hideRes();
  if(!v){manual=false;$('man').classList.remove('on');sel=[];man=[];flood=false;$('fld').classList.remove('on');fl=[]}
  resize();
}
$('are').onclick=function(){
  setArea(!areaMode);
  if(areaMode){measure=false;syncTools();mp=[];probe=null;report()}
  else $('st').textContent=D?D.count+' đối tượng':'Chưa có bản vẽ';
};
$('man').onclick=function(){manual=!manual;if(manual){flood=false;$('fld').classList.remove('on')}this.classList.toggle('on',manual);man=[];hideRes();draw();$('st').textContent=manual?'Chạm lần lượt các góc của vùng (tự bắt vào đỉnh gần nhất)':'Chạm vào bên trong một vùng kín để tính diện tích'};
$('fld').onclick=function(){
  flood=!flood;this.classList.toggle('on',flood);
  if(flood){manual=false;$('man').classList.remove('on');man=[]}
  hideRes();draw();
  $('st').textContent=flood?'Chạm vào bên trong vùng cần tính (vùng phải kín và nằm trọn trong màn hình)':'Chạm vào bên trong một vùng kín để tính diện tích';
};
$('clr').onclick=function(){if(curToolId()==='dimsel'){dimEdges=[];hideRes();$('st').textContent='Đã xóa các kích thước đã gắn';draw();return}fl=[];sel=[];man=[];mp=[];edge=null;rinfo=null;probe=null;hideRes();draw();if(areaMode)report();else if(measure)$('st').textContent=MH[mmode]};
$('unit').onchange=function(){
  if(areaMode)report();
  else if(measure){if(mmode==='pts'&&mp.length===2)mres();else if(mmode==='edge'&&edge)eres();else if(mmode==='rad'&&rinfo)rres()}
  draw();
};
function tap(sx,sy){
  if(areaMode){areaTap(sx,sy);return}
  if(textMode){textTap(sx,sy);return}
  if(editMode){editTap(sx,sy);return}
  if(drawMode){drawTap(sx,sy);return}
  if(!measure&&!areaMode){probeTap(sx,sy);return}
  if(measure&&mmode==='prop'){propTap(sx,sy);return}
  if(measure&&mmode==='del'){delTap(sx,sy);return}
  if(measure&&mmode==='dimsel'){dimTap(sx,sy);return}
  if(measure&&mmode==='edge'){edgeTap(sx,sy);return}
  if(measure&&mmode==='rad'){radTap(sx,sy);return}
  if(mp.length>=2)mp=[];
  mp.push(snap(sx,sy));
  if(mp.length===2&&mp[0][0]===mp[1][0]&&mp[0][1]===mp[1][1]){mp.pop();$('st').textContent='Điểm thứ hai trùng điểm thứ nhất, hãy chọn điểm khác';draw();return}
  if(mp.length===2){
    var dx=mp[1][0]-mp[0][0],dy=mp[1][1]-mp[0][1];
    mres();
  }else{hideRes();$('st').textContent='Chạm điểm thứ hai để đo'}
  draw();
}
function fmt(n){return n.toLocaleString('vi-VN',{maximumFractionDigits:3})}
function status(sx,sy){
  if((measure&&mp.length)||areaMode)return;
  var p=toWorld(sx,sy);$('st').textContent='X '+fmt(p[0])+'   Y '+fmt(p[1]);
}

/* ---------- UI ---------- */
function msg(t){var m=$('msg');if(!t){m.style.display='none';return}m.textContent=t;m.style.display='block'}
function load(text,name){
  msg('');
  var head=text.slice(0,32);
  if(/^AC10/.test(head)){msg('File DWG là định dạng đóng của Autodesk, app chưa đọc được. Hãy mở bản vẽ trong AutoCAD hoặc ứng dụng CAD khác, chọn Save As, rồi lưu thành DXF.');return}
  if(/AutoCAD Binary DXF/.test(head)){msg('Đây là DXF dạng nhị phân. Hãy lưu lại thành DXF dạng văn bản (ASCII).');return}
  try{
    hidden.clear();mp=[];sel=[];man=[];fl=[];drawn=[];ds=null;esel=[];eu=[];ebase=null;ephase='sel';tsel=null;tu=[];dimEdges=[];xu=[];pu=[];edge=null;rinfo=null;probe=null;hideRes();
    var doc=parse(text);D=build(doc);
    $('unit').value='raw';
    if(!D.count&&!D.texts.length){D=null;msg('Không tìm thấy đối tượng nào để vẽ trong file này.');return}
    $('title').textContent=name;$('empty').style.display='none';
    fit();
    $('st').textContent=D.count+' đối tượng, '+Object.keys(D.layers).length+' layer';
    renderLayers();
  }catch(err){D=null;msg('Không đọc được file: '+err.message)}
}
$('file').addEventListener('change',function(e){
  var f=e.target.files[0];if(!f)return;
  var r=new FileReader();
  r.onload=function(){var d=decodeFile(r.result);FILE_CP=d.cp;load(d.text,f.name)};
  r.onerror=function(){msg('Không mở được file.')};
  r.readAsArrayBuffer(f);e.target.value='';
});
$('fit').onclick=fit;
function setMeasure(on){
  measure=on;if(measure)setArea(false);if(measure&&editMode)setEdit(false);if(measure&&textMode)setText(false);if(measure&&drawMode){drawMode=false;ds=null;$('drw').classList.remove('on')}mp=[];edge=null;rinfo=null;probe=null;hideRes();updRow();syncTools();draw();
  $('st').textContent=measure?MH[mmode]:(D?D.count+' đối tượng':'Chưa có bản vẽ');
};
$('lay').onclick=function(){if(D)$('sheet').classList.add('open')};
$('close').onclick=function(){$('sheet').classList.remove('open')};
function updCount(){if(!D)return;var ks=Object.keys(D.layers);$('lcount').textContent='Layer ('+ks.filter(function(n){return !hidden.has(n)}).length+'/'+ks.length+')'}
$('allOn').onclick=function(){hidden.clear();renderLayers();draw()};
$('allOff').onclick=function(){Object.keys(D.layers).forEach(function(n){hidden.add(n)});renderLayers();draw()};
function renderLayers(){
  var box=$('list');box.textContent='';
  Object.keys(D.layers).sort().forEach(function(n){
    var row=document.createElement('label');row.className='lay';
    var cb=document.createElement('input');cb.type='checkbox';cb.checked=!hidden.has(n);
    cb.onchange=function(){if(cb.checked)hidden.delete(n);else hidden.add(n);updCount();draw()};
    var sw=document.createElement('span');sw.className='sw';
    var c=aci(D.layerCol[n]||7);sw.style.background=c==='fg'?'var(--fg)':c;
    var nm=document.createElement('span');nm.className='n';nm.textContent=n;
    var ct=document.createElement('small');ct.textContent=D.layers[n];
    row.append(cb,sw,nm,ct);box.append(row);updCount();
  });
}

/* ---------- sample ---------- */
function sample(){
  var o=[],p=function(c,v){o.push(c,v)};
  p(0,'SECTION');p(2,'TABLES');
  [['TUONG',7],['CUA',3],['NOI_THAT',4],['GHI_CHU',2]].forEach(function(l){p(0,'LAYER');p(2,l[0]);p(70,0);p(62,l[1])});
  p(0,'STYLE');p(2,'VNTIME');p(70,0);p(3,'vntime.ttf');p(0,'STYLE');p(2,'TNR');p(70,0);p(3,'times.ttf');p(1000,'Times New Roman');
  p(0,'ENDSEC');p(0,'SECTION');p(2,'ENTITIES');
  function poly(l,pts,closed){p(0,'LWPOLYLINE');p(8,l);p(90,pts.length);p(70,closed?1:0);pts.forEach(function(q){p(10,q[0]);p(20,q[1])})}

  line('TUONG',5500,0,5500,2400);line('TUONG',5500,3400,5500,6000);line('TUONG',5500,3000,9000,3000);
  p(0,'ARC');p(8,'CUA');p(10,5500);p(20,2400);p(40,1000);p(50,270);p(51,360);
  line('CUA',5500,2400,5500,3400);
  p(0,'CIRCLE');p(8,'NOI_THAT');p(10,2500);p(20,3000);p(40,700);
  poly('NOI_THAT',[[800,800],[2200,800],[2200,1400],[800,1400]],true);
  poly('NOI_THAT',[[6500,3600],[8500,3600],[8500,5500],[6500,5500]],true);
  [['PHÒNG KHÁCH',1200,4800],['BẾP',7000,1400],['PHÒNG NGỦ',6800,4400]].forEach(function(t){
    p(0,'TEXT');p(8,'GHI_CHU');p(10,t[1]);p(20,t[2]);p(40,300);p(1,t[0])});
  p(0,'TEXT');p(8,'GHI_CHU');p(7,'VNTIME');p(10,1200);p(20,4200);p(40,300);p(1,'Phßng ngñ (.VnTime)');
  p(0,'TEXT');p(8,'GHI_CHU');p(7,'TNR');p(10,1200);p(20,3600);p(40,300);p(1,'Times New Roman: Phòng ngủ');
